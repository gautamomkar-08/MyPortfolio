<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leetcode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- heading
    user
    stats -->
    <div class="container">
        <h1>leetcode</h1>
        <div class="user-container">
            <p>Enter your username:</p>
            <div class="user-input-container">
                <input type="text" id="user-input" placeholder="username">
                <button id="search-btn">search</button>
            </div>
        </div>
        <div class="stats-container">
            <div class="prograss">
                <div class="prograss-item">
                    <div class="easy-prograss circle">
                        <span id="easy-label"></span>
                        Easy
                    </div>
                </div>
                <div class="prograss-item circle">
                    <div class="medium-prograss">
                        <span id="medium-label"></span>
                        Medium
                    </div>
                </div>
                <div class="prograss-item circle">
                    <div class="hard-prograss">
                        <span id="hard-label"></span>
                        Hard
                    </div>
                </div>
            </div>
            <div class="stats-cards">
                
            </div>
        </div>
    </div>
    <script src="practice.js"></script>
</body>
</html>
