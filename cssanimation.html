<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cssAnimation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif;
        }
        i{
            position: absolute;
            color: white;
            font-size: 50px;
        }
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        .main-container {
            height: 300px;
            width: 300px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle {
            width: 100%;
            height: 100%;
            border: 5px solid;
            border-radius: 50%;
            position: absolute;
        }

        .one {
            border-color: rgb(206, 39, 39);
            animation: animate 1s ease-in infinite 0.5s;
        }

        .two {
            border-color: green;
            animation: animate 1s ease-in infinite 0.5s;
        }

        .three {
            border-color: blue;
            animation: animate 1s ease-in infinite 1s;
        }

        @keyframes animate {
            0% {
                rotate: 0deg;
                width: 100%;
            }

            50% {
                rotate: 180deg;
                width: 40%;
            }

            100% {
                rotate: 360deg;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <i class="fa-solid fa-user"></i>
    <div class="main-container">
        <div class="circle one">
        </div>
        <div class="circle two">
        </div>
        <div class="circle three">
        </div>
    </div>
</body>

</html>
